<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Archives</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">Ar</div>
      <h1>Archives</h1>
      <p>Library & Archives Mobile App — Portal</p>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <div class="auth-foot">
      New member? <a href="signup.html">Create an account</a>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('authError');
  errBox.classList.remove('show');

  const payload = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  };

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');

    setSession(data);
    window.location.href = data.role === 'admin' ? 'admin.html' : 'user.html';
  } catch (err) {
    errBox.textContent = err.message || 'Could not sign in. Is the backend running?';
    errBox.classList.add('show');
  }
});
</script>
</body>
</html>
